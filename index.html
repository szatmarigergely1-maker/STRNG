<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STRNG Training System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Montserrat', sans-serif; background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; padding-bottom: 95px; }
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col bg-black">

  <!-- FEJLÉC -->
  <header class="p-4 border-b border-zinc-900 bg-zinc-950/90 sticky top-0 backdrop-blur z-20 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-xl font-black tracking-tighter">STRNG</span>
      <span class="text-xs uppercase tracking-widest text-zinc-400 border-l border-zinc-800 pl-2 font-bold" id="header-title">Program</span>
    </div>
    <div id="quick-cycle-badge" class="text-[11px] font-black bg-zinc-900 border border-zinc-800 px-2.5 py-1 rounded-lg text-emerald-400">
      1. CIKLUS
    </div>
  </header>

  <!-- TAB 1: PROGRAM ÉS VÍZSZINTES NAPTÁR -->
  <div id="tab-program" class="tab-content active flex-grow">
    <!-- VÍZSZINTESEN GÖRGETHETŐ NAPTÁR -->
    <div class="bg-zinc-950 border-b border-zinc-900 sticky top-[57px] z-10 py-2.5 px-3">
      <div id="calendar-bar" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>

    <!-- AZ ADOTT NAP RÉSZLETEI -->
    <main class="p-4 max-w-lg mx-auto w-full space-y-4">
      <div id="day-header" class="flex justify-between items-center border-b border-zinc-900 pb-2"></div>
      <div id="day-content" class="space-y-4"></div>
    </main>
  </div>

  <!-- TAB 2: SÚLYOK ÉS FUTÓIDŐK BEÁLLÍTÁSA -->
  <main id="tab-calc" class="tab-content p-4 max-w-lg mx-auto w-full space-y-5">
    <div class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b border-zinc-900 pb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-400">5/3/1 Training Max (TM)</h2>
        <span class="bg-emerald-950/60 text-emerald-400 border border-emerald-900/50 px-2.5 py-1 rounded-lg text-xs font-black tracking-wider" id="calc-cycle-lbl">1. Ciklus</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Guggolás (Squat)</label>
          <input type="number" id="tm-sq" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm" placeholder="kg">
        </div>
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Fekvenyomás (Bench)</label>
          <input type="number" id="tm-bp" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm" placeholder="kg">
        </div>
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Felhúzás (Deadlift)</label>
          <input type="number" id="tm-dl" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm" placeholder="kg">
        </div>
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">Mellből nyomás (OHP)</label>
          <input type="number" id="tm-ohp" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm" placeholder="kg">
        </div>
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveMaxes()" class="flex-grow bg-emerald-600 text-white font-black text-xs px-4 py-3 rounded-xl hover:bg-emerald-500 transition uppercase tracking-wide">
          Súlyok Mentése
        </button>
        <button onclick="advanceCycle()" class="flex-grow bg-zinc-900 text-white font-black text-[11px] px-4 py-3 rounded-xl hover:bg-zinc-800 transition uppercase tracking-wide border border-zinc-800 flex items-center justify-center gap-1.5">
          Ciklus Léptetés <i class="fa-solid fa-arrow-up-right-dots text-emerald-400"></i>
        </button>
      </div>
    </div>

    <div class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl space-y-4 shadow-xl">
      <h2 class="text-sm font-bold uppercase tracking-wider text-sky-400">Futás Időeredmények</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">2K Idő (MM:SS)</label>
          <input type="text" id="run-2k-input" placeholder="08:30" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm text-center font-mono">
        </div>
        <div>
          <label class="text-[10px] uppercase text-zinc-500 font-bold block mb-1">5K Idő (MM:SS)</label>
          <input type="text" id="run-5k-input" placeholder="24:00" class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-white text-sm text-center font-mono">
        </div>
      </div>
      <button onclick="saveRunTimes()" class="w-full bg-sky-600 text-white font-black text-xs px-4 py-3 rounded-xl hover:bg-sky-500 transition uppercase tracking-wide">
        Futóidők Mentése
      </button>
      <div id="paces-summary" class="grid grid-cols-2 gap-2 pt-2"></div>
    </div>
  </main>

  <!-- TAB 3: EDZÉSNAPLÓ -->
  <main id="tab-log" class="tab-content p-4 max-w-lg mx-auto w-full space-y-5">
    <div class="bg-zinc-950 border border-zinc-900 p-5 rounded-2xl space-y-4 shadow-xl">
      <h2 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Egyéni Edzés Naplózása</h2>
      <div class="grid grid-cols-2 gap-2">
        <input type="date" id="custom-log-date" class="bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-xl">
        <select id="custom-log-type" class="bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-xl">
          <option value="Súlyemelés">Súlyemelés</option>
          <option value="Metcon">Metcon</option>
          <option value="Futás">Futás</option>
          <option value="Egyéb">Egyéb</option>
        </select>
      </div>
      <input type="text" id="custom-log-title" placeholder="Edzés / Feladat neve" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-3 rounded-xl">
      <textarea id="custom-log-details" rows="2" placeholder="Részletek, súlyok, idők..." class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-3 rounded-xl resize-none"></textarea>
      <button onclick="saveCustomLog()" class="w-full bg-white text-black font-black text-xs py-3 rounded-xl uppercase tracking-wider">
        Mentés a Naplóba
      </button>
    </div>

    <div class="space-y-3">
      <h3 class="text-xs font-black uppercase tracking-wider text-zinc-500 px-1">Rögzített Eredmények</h3>
      <div id="logs-container" class="space-y-2.5"></div>
    </div>
