<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STRNG Training Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

  <!-- HEADER -->
  <header class="p-5 border-b border-zinc-800 flex justify-between items-center bg-zinc-950/80 sticky top-0 backdrop-blur z-20">
    <div class="flex items-center gap-2">
      <span class="text-xl font-black tracking-tighter">STRNG</span>
      <span class="text-xs uppercase tracking-widest text-zinc-400 border-l border-zinc-700 pl-2 font-bold">Logbook</span>
    </div>
    <div class="flex gap-2">
      <button onclick="exportData()" title="Mentés letöltése" class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white">
        <i class="fa-solid fa-download text-xs"></i>
      </button>
      <label title="Mentés visszatöltése" class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white cursor-pointer">
        <i class="fa-solid fa-upload text-xs"></i>
        <input type="file" id="import-file" class="hidden" onchange="importData(event)">
      </label>
    </div>
  </header>

  <main class="flex-grow p-4 max-w-lg mx-auto w-full space-y-6">

    <!-- GYORS ÚJ EDZÉS FELVITEL -->
    <div class="bg-zinc-900/60 border border-zinc-800 p-5 rounded-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold uppercase tracking-wider text-zinc-400">Új edzés rögzítése</h2>
        <input type="date" id="log-date" class="bg-zinc-950 border border-zinc-800 text-xs text-white px-2.5 py-1.5 rounded-lg focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <select id="log-type" class="bg-zinc-950 border border-zinc-800 text-xs text-white p-2.5 rounded-xl focus:outline-none">
          <option value="Erő / Súlyemelés">Erő / Súlyemelés</option>
          <option value="WOD / Metcon">WOD / Metcon</option>
          <option value="STRNG Dads saját">STRNG Dads saját</option>
          <option value="Kardió / Erőnlét">Kardió / Erőnlét</option>
        </select>
        <input type="text" id="log-title" placeholder="Pl. Back Squat 5x5 vagy Fran" class="bg-zinc-950 border border-zinc-800 text-xs text-white p-2.5 rounded-xl focus:outline-none">
      </div>

      <textarea id="log-details" rows="3" placeholder="Részletek: súlyok, körök, idők, érzet (RPE)..." class="w-full bg-zinc-950 border border-zinc-800 text-xs text-white p-3 rounded-xl focus:outline-none resize-none"></textarea>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer text-xs text-zinc-400 font-semibold select-none">
          <input type="checkbox" id="log-pr" class="w-4 h-4 rounded text-orange-500 bg-zinc-950 border-zinc-700">
          Új PR (Egyéni Csúcs)? 🏆
        </label>
        <button onclick="saveWorkout()" class="bg-white text-black font-extrabold text-xs px-5 py-2.5 rounded-xl hover:bg-zinc-200 transition">
          Mentés
        </button>
      </div>
    </div>

    <!-- KERESŐ / SZŰRŐ -->
    <div class="flex gap-2">
      <div class="relative flex-grow">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-zinc-600 text-xs"></i>
        <input type="text" id="search-input" oninput="renderLogs()" placeholder="Keresés gyakorlatra vagy dátumra..." class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white pl-8 pr-3 py-2 rounded-xl focus:outline-none">
      </div>
      <select id="filter-type" onchange="renderLogs()" class="bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 px-3 py-2 rounded-xl focus:outline-none">
        <option value="all">Minden</option>
        <option value="pr">Csak PR 🏆</option>
      </select>
    </div>

    <!-- EDZÉSNANAPLÓ LISTA -->
    <div id="logs-container" class="space-y-3">
      <!-- Dinamikus edzéskártyák -->
    </div>

  </main>

  <script>
    // PWA Service Worker regisztráció
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let workouts = JSON.parse(localStorage.getItem('strng_personal_logs') || '[]');

    document.getElementById('log-date').valueAsDate = new Date();

    function saveWorkout() {
      const date = document.getElementById('log-date').value;
      const type = document.getElementById('log-type').value;
      const title = document.getElementById('log-title').value.trim();
      const details = document.getElementById('log-details').value.trim();
      const isPR = document.getElementById('log-pr').checked;

      if (!title) return;

      const newLog = {
        id: 'log_' + Date.now(),
        date: date,
        type: type,
        title: title,
        details: details,
        isPR: isPR
      };

      workouts.unshift(newLog);
      localStorage.setItem('strng_personal_logs', JSON.stringify(workouts));

      document.getElementById('log-title').value = '';
      document.getElementById('log-details').value = '';
      document.getElementById('log-pr').checked = false;

      renderLogs();
    }

    function deleteWorkout(id) {
      workouts = workouts.filter(w => w.id !== id);
      localStorage.setItem('strng_personal_logs', JSON.stringify(workouts));
      renderLogs();
    }

    function renderLogs() {
      const container = document.getElementById('logs-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      const filter = document.getElementById('filter-type').value;

      container.innerHTML = '';

      const filtered = workouts.filter(w => {
        const matchesSearch = w.title.toLowerCase().includes(search) || w.details.toLowerCase().includes(search) || w.date.includes(search);
        const matchesFilter = filter === 'all' || (filter === 'pr' && w.isPR);
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-zinc-600 text-xs py-8 italic">Még nincs rögzített edzésed.</p>';
        return;
      }

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = "bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-2 relative";
        
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider">
                ${w.date} &bull; ${w.type}
              </div>
              <h3 class="text-sm font-bold text-white flex items-center gap-1.5 mt-0.5">
                ${w.title}
                ${w.isPR ? '<span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-1.5 py-0.5 rounded">PR</span>' : ''}
              </h3>
            </div>
            <button onclick="deleteWorkout('${w.id}')" class="text-zinc-600 hover:text-red-400 transition p-1 text-xs">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
          <p class="text-xs text-zinc-400 whitespace-pre-line leading-relaxed">${w.details}</p>
        `;
        container.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(workouts, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `strng_edzesnaplo_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            workouts = imported;
            localStorage.setItem('strng_personal_logs', JSON.stringify(workouts));
            renderLogs();
          }
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    renderLogs();
  </script>
</body>
</html>
